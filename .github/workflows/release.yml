name: Release

# Push a version tag (no "v" prefix, as Obsidian requires), e.g. 0.4.7
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the GitHub release
      id-token: write       # sign the attestations
      attestations: write   # store the attestations
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Tag must match manifest.json
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json version $version"
            exit 1
          fi

      - run: npm ci

      - run: npm test

      - run: npm run build

      - name: Release notes from docs/changelog.md
        run: |
          awk -v v="$GITHUB_REF_NAME" '
            /^## / { if (found) exit; found = ($2 == v || $2 == "v" v) ; next }
            found
          ' docs/changelog.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::No section for $GITHUB_REF_NAME in docs/changelog.md"
            exit 1
          fi

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            main.js manifest.json styles.css \
            --title "$GITHUB_REF_NAME" --notes-file notes.md
